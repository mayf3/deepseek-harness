# The resumed history has no request header; pressure must use the first resolved route.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents: []
          workspaceContext: false
      - id: compaction-basic
        name: '@deepseek-ai/dsh-compaction-basic'
        config:
          auto: pre-request
          thresholdRatio: 0.8
          retainTokens: 20
          maxTokens: 32
          compactionRetries: 0
          summarizationProvider: ''
          summarizationModel: ''
      - insert:
          - id: compaction-pressure-agent
            name: './tests/fixtures/compaction-pressure-agent.ts'
